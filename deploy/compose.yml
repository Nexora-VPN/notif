# Nexora Notif's compose stack. The install writes .env beside this file with
# the answers to the manifest's options (NEXORA_OPT_*), the panel's address
# and the claim code; `docker compose up -d` starts it.
services:
  notif:
    image: ghcr.io/nexora-vpn/notif:${NEXORA_ADDON_VERSION:-latest}
    container_name: notif
    restart: unless-stopped
    # Time for the sends in hand to finish on a stop (Notif waits up to 45s).
    stop_grace_period: 60s
    env_file: .env
    # A proxy on the host is reached from the container at
    # host.docker.internal (the docker host's gateway): name it in
    # local_proxies as host.docker.internal:PORT.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NEXORA_OPT_PORT:-8097}:${NEXORA_OPT_PORT:-8097}"
      # Notif's own HTTPS (https=panel, acme, acme-http or self-signed): install.sh publishes
      # the public address's port to it (443:8443 for acme), and otherwise
      # a loopback port nothing uses.
      - "${NEXORA_HTTPS_PUBLISH:-127.0.0.1::8443}"
      # The CA's HTTP-01 check (https=acme-http): port 80, else a loopback
      # port nothing uses.
      - "${NEXORA_HTTP_PUBLISH:-127.0.0.1::8080}"
    volumes:
      - ./data:/data
