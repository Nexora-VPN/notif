# The image the docker install pulls: ghcr.io/nexora-vpn/notif, for amd64 and
# arm64. release.yml runs this on every v* tag, once the manifest is checked
# and before the release is created. Run it by hand from the Actions tab on a
# tag to build that release's image again, or on a branch for a test image
# tagged with the branch's name. `latest` moves on a stable tag only.
name: docker
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/nexora-vpn/notif
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
      # The labels stay the Dockerfile's own.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_PRIMEUI_LICENSE=${{ secrets.VITE_PRIMEUI_LICENSE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
