# On a v* tag: the image the docker install pulls (docker.yml), then the
# release with the binaries the script install downloads and their checksums,
# last, so the directory never sees a release whose image is missing. The
# manifest must name the tag's version and carry Nexora's signature — signed
# on the owner's machine (scripts/sign.sh) before the tag is pushed, since the
# signature covers the version.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  check:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: the manifest names this release and Nexora signed it
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' nexora-addon.json | head -n 1)"
          [ "$want" = "$have" ] || { echo "nexora-addon.json says $have, the tag is $want"; exit 1; }
          kit() { go run github.com/nexora-vpn/addon-kit/cmd/nexora-addon "$@"; }
          kit check nexora-addon.json
          [ "$(kit verify nexora-addon.json)" = "signed by: Nexora" ] || { echo "nexora-addon.json is not signed by Nexora: run scripts/sign.sh"; exit 1; }

  image:
    needs: check
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  release:
    needs: image
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: the admin web
        working-directory: frontend
        env:
          VITE_PRIMEUI_LICENSE: ${{ secrets.VITE_PRIMEUI_LICENSE }}
        run: npm ci --no-audit --no-fund && npm run build
      - name: binaries
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o notif .
            tar -czf "dist/notif-linux-${arch}.tar.gz" notif
          done
          cp nexora-addon.json install.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" $pre --generate-notes \
            --notes "Docker: \`docker pull ghcr.io/nexora-vpn/notif:${GITHUB_REF_NAME#v}\`"
